name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/codex-quota-mini/server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix plugins/codex-quota-mini/server ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: xcrun swiftc -swift-version 5 -typecheck plugins/codex-quota-mini/native/QuotaMini.swift -framework AppKit -framework WebKit
      - run: npm test
      - run: npm run test:browser
      - run: npm run check
      - run: npm run package
